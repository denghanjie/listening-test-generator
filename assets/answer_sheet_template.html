<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{title}} - Answer Sheet</title>
    <style>
        @media print { .page-break { page-break-before: always; } }
        body {
            font-family: "Times New Roman", Georgia, serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
        }
        .header {
            text-align: center;
            border-bottom: 3px double #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .header h2 {
            margin: 5px 0 0 0;
            font-size: 16px;
            font-weight: normal;
            color: #555;
        }
        .student-info {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            padding: 10px;
            background: #f9f9f9;
            border: 1px solid #ddd;
        }
        .student-info label {
            font-weight: bold;
            margin-right: 10px;
        }
        .student-info input {
            border: none;
            border-bottom: 1px solid #333;
            width: 150px;
            font-size: 14px;
            background: transparent;
        }
        .section {
            margin-bottom: 30px;
        }
        .section-header {
            background: #2c3e50;
            color: white;
            padding: 10px 15px;
            margin: 0;
            font-size: 16px;
            text-transform: uppercase;
        }
        .section-desc {
            background: #ecf0f1;
            padding: 8px 15px;
            margin: 0 0 10px 0;
            font-style: italic;
            font-size: 13px;
            border-left: 4px solid #2c3e50;
        }
        .items-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px 30px;
            padding: 10px;
        }
        .item {
            display: flex;
            align-items: center;
            font-size: 14px;
        }
        .item-num {
            font-weight: bold;
            min-width: 30px;
            color: #2c3e50;
        }
        .item-blank {
            flex: 1;
            border-bottom: 1px solid #333;
            min-height: 20px;
            margin-left: 5px;
        }
        .sentence-item {
            margin: 12px 0;
            padding: 10px;
            background: #fafafa;
            border-left: 3px solid #3498db;
        }
        .sentence-text {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .sentence-answer {
            border-bottom: 1px solid #333;
            min-height: 20px;
            display: inline-block;
            width: 200px;
        }
        .total-score {
            text-align: right;
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            font-weight: bold;
            font-size: 16px;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 12px;
            color: #777;
            border-top: 1px solid #ddd;
            padding-top: 10px;
        }
        .mc-item {
            margin: 16px 0;
            padding: 14px 16px;
            background: #fafafa;
            border-left: 3px solid #9b59b6;
            border-radius: 0 6px 6px 0;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .mc-number {
            font-weight: bold;
            font-size: 15px;
            color: #2c3e50;
            min-width: 24px;
            margin-top: 2px;
        }
        .mc-options {
            flex: 1;
        }
        .mc-option-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
            font-size: 14px;
            line-height: 1.5;
        }
        .mc-circle {
            width: 16px;
            height: 16px;
            border: 2px solid #555;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .mc-label {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>{{title}}</h1>
        <h2>{{subtitle}}</h2>
    </div>
    <div class="student-info">
        <div><label>Name:</label> <input type="text"></div>
        <div><label>Class:</label> <input type="text"></div>
        <div><label>Date:</label> <input type="text"></div>
        <div><label>Score:</label> <input type="text"> / {{total_points}}</div>
    </div>
    {{sections}}
    <div class="total-score">Total Score: _______ / {{total_points}}</div>
    <div class="footer">Good luck! Listen carefully and check your spelling.</div>
</body>
</html>
